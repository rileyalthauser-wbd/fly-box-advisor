  <div class="page">
    <header class="page-header">
      <h1>🪶 Fly Box Advisor</h1>
      <p class="subtitle">Photograph your fly box, tell us where and when you're fishing, and get hatch-based recommendations.</p>
    </header>

    <form id="analyze-form" class="card">
      <div class="field">
        <label>What do you need?</label>
        <div class="mode-toggle" role="radiogroup" aria-label="Choose mode">
          <label class="mode-option">
            <input type="radio" name="mode" value="analyze" checked />
            <span>📷 Analyze my flies</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="fill" />
            <span>🧰 Fill my fly box</span>
          </label>
        </div>
        <p class="mode-hint" id="mode-hint">Upload a photo of your fly box to see what you have and what to use.</p>
      </div>

      <div class="field" id="photo-field">
        <label for="photo">Photo of your fly box</label>
        <input type="file" id="photo" name="image" accept="image/*" required />
        <img id="photo-preview" class="photo-preview hidden" alt="Preview of selected photo" />
      </div>

      <div class="field">
        <label for="river">River / location</label>
        <input type="text" id="river" name="river" placeholder="e.g. Madison River, Montana" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="field">
          <label for="timeOfDay">Time of day</label>
          <select id="timeOfDay" name="timeOfDay" required>
            <option value="dawn">Dawn</option>
            <option value="morning" selected>Morning</option>
            <option value="midday">Midday</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
            <option value="dusk">Dusk</option>
            <option value="night">Night</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit-btn">Analyze my flies</button>
    </form>

    <section id="status" class="status hidden"></section>

    <section id="results" class="results hidden"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
